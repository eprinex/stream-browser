<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni sekme</title>
  <style>
    :root {
      --bg: #0d0d0f;
      --text: #e8e8ed;
      --muted: #8b8b98;
      --accent: #f47321;
      --border: #2a2a32;
      --input: #16161a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background:
        radial-gradient(1200px 600px at 50% -10%, #1a1510 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Candara, "Trebuchet MS", sans-serif;
    }
    main {
      min-height: 100%;
      display: grid;
      place-content: center;
      padding: 24px;
      gap: 14px;
    }
    h1 {
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.03em;
      text-align: center;
    }
    p {
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
      max-width: 400px;
      margin: 0 auto;
    }
    form {
      display: flex;
      gap: 8px;
      width: min(520px, 92vw);
      margin: 8px auto 0;
    }
    input {
      flex: 1;
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      padding: 0 18px;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      height: 44px;
      padding: 0 18px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #111;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Stream Browser</h1>
    <p>Google Chrome motoru · URL yaz veya yapıştır. Geçmiş önerisi yok.</p>
    <form id="go" autocomplete="off">
      <input
        id="q"
        type="text"
        placeholder="URL veya arama"
        autofocus
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        data-lpignore="true"
      />
      <button type="submit">Git</button>
    </form>
  </main>
  <script>
    const q = document.getElementById('q');
    document.getElementById('go').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = (q.value || '').trim();
      if (!v) return;
      let url = v;
      if (!/^https?:\/\//i.test(v)) {
        if (v.includes('.') && !v.includes(' ')) url = 'https://' + v.replace(/^\/+/, '');
        else url = 'https://www.google.com/search?q=' + encodeURIComponent(v);
      }
      location.href = url;
    });
  </script>
</body>
</html>
